name: Daily Insider Scan

on:
  schedule:
    # 12:00 UTC on weekdays (7 AM EST / 8 AM EDT).
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Filing date to scan (YYYY-MM-DD or 'yesterday')"
        default: "yesterday"
      lookback:
        description: "Days to look back for cluster detection"
        default: "5"
      zscore:
        description: "Z-score threshold for rip/dip tagging"
        default: "1.5"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: skills/signal-sweep
        run: uv sync --locked

      - name: Run insider scan
        env:
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: skills/signal-sweep
        run: |
          DATE="${{ github.event.inputs.date || 'yesterday' }}"
          LOOKBACK="${{ github.event.inputs.lookback || '5' }}"
          ZSCORE="${{ github.event.inputs.zscore || '1.5' }}"

          uv run python scripts/scan_insiders.py \
            --date "$DATE" \
            --lookback "$LOOKBACK" \
            --zscore "$ZSCORE"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insider-scan-${{ github.run_id }}
          path: skills/signal-sweep/signal-sweep-cache/insiders/
          retention-days: 90
